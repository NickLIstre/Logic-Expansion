<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generate Coupons</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2rem;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-section {
      display: none;
      margin-top: 1rem;
      padding: 1rem;
      border: 1px solid #ccc;
      border-radius: 0.5rem;
    }
    textarea {
      width: 100%;
      height: 1rem;
    }
  </style>
</head>
<body>
  <h1>Generate Coupons</h1>

<div class="form-group">
    <label for="couponType">Coupon Type:</label>
    <select id="couponType">
      <option value="">-- Select --</option>
      <option value="saveX">Save $ off cart</option>
      <option value="savePercent">Save % off cart</option>
      <option value="xForYShows">Total $ for # of shows</option>
      <option value="xOffYTix">Save $ off on # of tix</option>
      <option value="freeTier">Get # of Free Tier tickets</option>
      <option value="additionalShows">Save % on additional shows</option>
    </select>
  </div>

  <!-- Save $x off cart -->
  <div class="form-section" id="saveX">
  <div class="form-group">
    <label>Amount ($):</label>
     <input type="number" id="saveX_amount" step="0.01" min="0">
  </div>

  <!-- Advanced Settings -->
  <div class="advanced-settings">
    <h4>Advanced Settings</h4>
    <div class="form-group">
      <label>Min Order Size:</label>
      <input type="number" id="saveX_minOrder" step="1" min="1">
    </div>
  </div>

  <button id="generateSaveXBtn" type="button">Generate Code</button>
  <textarea readonly id="saveX_title"></textarea>
  <textarea readonly id="saveX_description"></textarea>
  <textarea readonly id="saveX_code"></textarea>
</div>

<!-- Save x% off cart -->
<div class="form-section" id="savePercent">
  <div class="form-group">
    <label>Percentage (%):</label>
    <input type="number" id="savePercent_percent" step="0.01" min="0">
  </div>

  <!-- Advanced Settings -->
  <div class="advanced-settings">
    <h4>Advanced Settings</h4>
    <div class="form-group">
      <label>Min Order Size:</label>
      <input type="number" id="savePercent_minOrder" step="1" min="1">
    </div>
  </div>

  <button id="generateSavePercentBtn" type="button">Generate Code</button>
  <textarea readonly id="savePercent_title"></textarea>
  <textarea readonly id="savePercent_description"></textarea>
  <textarea readonly id="savePercent_code"></textarea>
</div>

<!-- Total $x for y# of shows -->
<div class="form-section" id="xForYShows">
  <div class="form-group">
    <label>Total price for all shows ($):</label>
    <input type="number" id="xForYShows_amount">
  </div>
  <div class="form-group">
    <label># of shows:</label>
    <input type="number" id="xForYShows_y">
  </div>

  <!-- Advanced Settings -->
  <div class="advanced-settings">
    <h4>Advanced Settings</h4>
    <div class="form-group">
      <label>Min Order Size:</label>
      <input type="number" id="xForYShows_minOrder">
    </div>
    <div class="form-group">
      <label>Only tickets to:</label>
      <input type="text" id="xForYShows_onlyTicketsTo" placeholder="Show group">
    </div>
    <div class="form-group">
      <label>
        <input type="radio" name="xForYShows_pricing" value="total" checked>
          Completely Free
      </label>
      <label>
        <input type="radio" name="xForYShows_pricing" value="base">
          Base Only
      </label>
    </div>
    <div class="form-group">
      <label>Order of application:</label>
      <label>
        <input type="radio" name="xForYShows_order" value="cheapest" checked>
          Cheapest first (default)
      </label>
      <label>
        <input type="radio" name="xForYShows_order" value="expensive">
          Most expensive first
      </label>
    </div>
  </div>

  <button id="generateXForYShowsBtn" type="button">Generate Code</button>
  <textarea readonly id="xForYShows_title"></textarea>
  <textarea readonly id="xForYShows_description"></textarea>
  <textarea readonly id="xForYShows_code"></textarea>
</div>

<!-- Save $x off on y# tix -->
<div class="form-section" id="xOffYTix">
  <div class="form-group">
    <label>Amount ($):</label>
    <input type="number" id="xOffYTix_amount">
  </div>
  <div class="form-group">
    <label>Minimum ticket count:</label>
    <input type="number" id="xOffYTix_y">
  </div>

  <!-- Advanced Settings -->
  <div class="advanced-settings">
    <h4>Advanced Settings</h4>
    <div class="form-group">
      <label>Only tickets to:</label>
      <input type="text" id="xOffYTix_onlyTicketsTo" placeholder="Show group or show name">
    </div>
    <div class="form-group">
      <label>
        <input type="radio" name="xOffYTix_pricing" value="total" checked>
          Completely Free
      </label>
      <label>
        <input type="radio" name="xOffYTix_pricing" value="base">
          Base Only
      </label>
    </div>
    <div class="form-group">
      <label>Order of application:</label>
      <label>
        <input type="radio" name="xOffYTix_order" value="cheapest" checked>
          Cheapest first (default)
      </label>
      <label>
        <input type="radio" name="xOffYTix_order" value="expensive">
          Most expensive first
      </label>
    </div>
  </div>

  <button id="generateXOffYTixBtn" type="button">Generate Code</button>
  <textarea readonly id="xOffYTix_title"></textarea>
  <textarea readonly id="xOffYTix_description"></textarea>
  <textarea readonly id="xOffYTix_code"></textarea>
</div>

<!-- Get x# Free Tier Ticket -->
<div class="form-section" id="freeTier">
  <div class="form-group">
    <label># of free tickets:</label>
    <input type="number" id="freeTier_x">
  </div>
  <div class="form-group">
    <label>Tier Name:</label>
    <input type="text" id="freeTier_tier">
  </div>

    <!-- Advanced Settings -->
  <div class="advanced-settings">
    <h4>Advanced Settings</h4>
    <div class="form-group">
      <label>Min Order Size:</label>
      <input type="number" id="freeTier_minOrder">
    </div>
    <div class="form-group">
      <label>Only tickets to:</label>
      <input type="text" id="freeTier_onlyTicketsTo" placeholder="Show group or show name">
    </div>
    <div class="form-group">
      <label>
        <input type="radio" name="freeTier_pricing" value="total" checked>
          Completely Free
      </label>
      <label>
        <input type="radio" name="freeTier_pricing" value="base">
          Base Only
      </label>
    </div>
    <div class="form-group">
      <label>Order of application:</label>
      <label>
        <input type="radio" name="freeTier_order" value="cheapest" checked>
          Cheapest first (default)
        </label>
      <label>
        <input type="radio" name="freeTier_order" value="expensive">
          Most expensive first
        </label>
    </div>
  </div>

  <button id="generateFreeTierBtn" type="button">Generate Code</button>
  <textarea readonly id="freeTier_title"></textarea>
  <textarea readonly id="freeTier_description"></textarea>
  <textarea readonly id="freeTier_code"></textarea>
</div>

<!-- Save x% on additional shows -->
<div class="form-section" id="additionalShows">
  <div class="form-group">
    <label>Discount Percentage (%):</label>
    <input type="number" id="additionalShows_percent" step="1" min="1">
  </div>
  <div class="form-group">
    <label># of tickets to apply discount on:</label>
    <input type="number" id="additionalShows_numTix" placeholder="Leave empty for unlimited">
  </div>

  <!-- Advanced Settings -->
  <div class="advanced-settings">
    <h4>Advanced Settings</h4>
    <div class="form-group">
      <label>Min Order Size:</label>
      <input type="number" id="additionalShows_minOrder">
    </div>
    <div class="form-group">
      <label>Only tickets to:</label>
      <input type="text" id="additionalShows_group" placeholder="Show group or show name">
    </div>
    <div class="form-group">
      <label>
        <input type="radio" name="additionalShows_pricing" value="total" checked>
        Completely Free
      </label>
      <label>
        <input type="radio" name="additionalShows_pricing" value="base">
        Base Only
      </label>
    </div>
    <div class="form-group">
      <label>Order of application:</label>
      <label>
        <input type="radio" name="additionalShows_order" value="cheapest" checked>
        Cheapest first (default)
      </label>
      <label>
        <input type="radio" name="additionalShows_order" value="expensive">
        Most expensive first
      </label>
    </div>
  </div>

  <button id="generateAdditionalShowsBtn" type="button">Generate Code</button>
  <textarea readonly id="additionalShows_title"></textarea>
  <textarea readonly id="additionalShows_description"></textarea>
  <textarea readonly id="additionalShows_code"></textarea>
</div>

<script>
  const couponType = document.getElementById("couponType");
  const sections = document.querySelectorAll(".form-section");

  couponType.addEventListener("change", () => {
    sections.forEach(section => section.style.display = "none");
    const selected = couponType.value;
    if (selected) {
      document.getElementById(selected).style.display = "block";
    }
  });

  // // Advanced Settings Toggle Button
  // document.querySelectorAll('.advanced-settings-toggle').forEach(toggle => {
  //   toggle.addEventListener('click', function() {
  //     const targetId = this.getAttribute('data-target');
  //     const target = document.getElementById(targetId);
  //     if (target.classList.contains('advanced-settings-collapsed')) {
  //       target.classList.remove('advanced-settings-collapsed');
  //     } else {
  //       target.classList.add('advanced-settings-collapsed');
  //     }
  //   });
  // });

  // Save $x off cart
  document.getElementById("generateSaveXBtn").addEventListener("click", () => {
    const saveX = document.getElementById("saveX_amount").value;
    const minOrder = document.getElementById("saveX_minOrder").value;
    
    if (saveX) {
      let title, description, code;
      
      if (minOrder && minOrder > 0) {
        title = `Title: Save $${saveX} off when buying ${minOrder} tickets or more`;
        description = `Description: $${saveX} off when buying ${minOrder} tickets or more`;
        code = `Code: IF dbo.MinOf(dbo.cart_NumSeats(@shopper), ${minOrder}) = ${minOrder}\nSET @discount = ${saveX}`;
      } else {
        title = `Title: Save $${saveX} off cart`;
        description = `Description: Save $${saveX} off cart total`;
        code = `Code: SET @discount = ${saveX}`;
      }
      
      document.getElementById("saveX_title").value = title;
      document.getElementById("saveX_description").value = description;
      document.getElementById("saveX_code").value = code;
    } else {
      document.getElementById("saveX_title").value = "";
      document.getElementById("saveX_description").value = "";
      document.getElementById("saveX_code").value = "";
    }
  });

  // Save x% off cart
  document.getElementById("generateSavePercentBtn").addEventListener("click", () => {
    const percent = document.getElementById("savePercent_percent").value;
    const minOrder = document.getElementById("savePercent_minOrder").value;
    
    if (percent) {
      let title, description, code;
      
      if (minOrder && minOrder > 0) {
        title = `Title: Save ${percent}% off when buying ${minOrder} tickets or more`;
        description = `Description: ${percent}% off when buying ${minOrder} tickets or more`;
        code = `Code: IF dbo.MinOf(dbo.cart_NumSeats(@shopper), ${minOrder}) = ${minOrder}\nSET @discount = dbo.cart_cheapestXSeatsBaseTotal(@shopper, 1000) * ${percent / 100}`;
      } else {
        title = `Title: Save ${percent}% off cart`;
        description = `Description: Save ${percent}% off cart total`;
        code = `Code: SET @discount = dbo.cart_cheapestXSeatsBaseTotal(@shopper, 1000) * ${percent / 100}`;
      }
      
      document.getElementById("savePercent_title").value = title;
      document.getElementById("savePercent_description").value = description;
      document.getElementById("savePercent_code").value = code;
    } else {
      document.getElementById("savePercent_title").value = "";
      document.getElementById("savePercent_description").value = "";
      document.getElementById("savePercent_code").value = "";
    }
  });

  // Total $x for y# of shows
document.getElementById("generateXForYShowsBtn").addEventListener("click", () => {
  const xForY_x = document.getElementById("xForYShows_amount").value;
  const xForY_y = document.getElementById("xForYShows_y").value;
  const minOrder = document.getElementById("xForYShows_minOrder").value;
  const onlyTicketsTo = document.getElementById("xForYShows_onlyTicketsTo").value.trim();
  const pricing = document.querySelector('input[name="xForYShows_pricing"]:checked').value;
  const order = document.querySelector('input[name="xForYShows_order"]:checked').value;
  
  if (xForY_x && xForY_y) {
    let title, description, code;
    let functionName = "cart_";
    
    // Cheapest or costliest
    functionName += order === "expensive" ? "costliest" : "cheapest";
    
    // Base function
    functionName += "XSeatsPerShow";
    
    // Show group or regular show
    if (onlyTicketsTo) {
      functionName += "Group";
    }
    
    // Total or BaseTotal
    functionName += pricing === "total" ? "Total" : "BaseTotal";

    functionName += "_maxY";
    
    let baseCode = `SET @discount = dbo.[${functionName}](@shopper, 1, ${xForY_y}) - ${xForY_x}`;
    let baseTitle = `$${xForY_x} total for ticket to ${xForY_y} shows`;
    let baseDescription = `When purchasing a ticket to ${xForY_y} shows, get all for $${xForY_x} total`;
    
    if (onlyTicketsTo) {
      baseTitle += ` in ${onlyTicketsTo}`;
      baseDescription += ` in ${onlyTicketsTo}`;
    }
    
    if (pricing === "base") {
      baseTitle += " (base price only)";
      baseDescription += " (base price only)";
    }
    
    if (order === "expensive") {
      baseTitle += " (most expensive first)";
      baseDescription += " (most expensive tickets first)";
    }
    
    // Min Order Size
    if (minOrder && minOrder > 0) {
      title = `Title: ${baseTitle} when buying ${minOrder} tickets or more`;
      description = `Description: ${baseDescription} when buying ${minOrder} tickets or more`;
      code = `Code: IF dbo.MinOf(dbo.cart_NumSeats(@shopper), ${minOrder}) = ${minOrder}\n${baseCode}`;
    } else {
      title = `Title: ${baseTitle}`;
      description = `Description: ${baseDescription}`;
      code = `Code: ${baseCode}`;
    }
    
    document.getElementById("xForYShows_title").value = title;
    document.getElementById("xForYShows_description").value = description;
    document.getElementById("xForYShows_code").value = code;
  } else {
    document.getElementById("xForYShows_title").value = "";
    document.getElementById("xForYShows_description").value = "";
    document.getElementById("xForYShows_code").value = "";
  }
});

// Save $x off on y+# tix
document.getElementById("generateXOffYTixBtn").addEventListener("click", () => {
  const xOffY_x = document.getElementById("xOffYTix_amount").value;
  const xOffY_y = document.getElementById("xOffYTix_y").value;
  const onlyTicketsTo = document.getElementById("xOffYTix_onlyTicketsTo").value.trim();
  const pricing = document.querySelector('input[name="xOffYTix_pricing"]:checked').value;
  const order = document.querySelector('input[name="xOffYTix_order"]:checked').value;
  
  if (xOffY_x && xOffY_y) {
    let title, description, code;
    
    let functionName = "cart_";
    
    // Cheapest or costliest
    functionName += order === "expensive" ? "costliest" : "cheapest";
    
    functionName += "XSeats";
    
    // Show group or show
    if (onlyTicketsTo) {
      functionName += "Group";
    }
    
    // Total or BaseTotal
    functionName += pricing === "total" ? "Total" : "BaseTotal";
    
    let baseCode = "";
    if (onlyTicketsTo) {
      baseCode = `IF dbo.MinOf(dbo.cart_NumSeats(@shopper), ${xOffY_y}) >= ${xOffY_y}\nSET @discount = dbo.${functionName}(@shopper, '${onlyTicketsTo}', ${xOffY_x})`;
    } else {
      baseCode = `IF dbo.MinOf(dbo.cart_NumSeats(@shopper), ${xOffY_y}) >= ${xOffY_y}\nSET @discount = dbo.${functionName}(@shopper, ${xOffY_x})`;
    }

    let baseTitle = `Save $${xOffY_x} off on ${xOffY_y} tix`;
    let baseDescription = `Get $${xOffY_x} off when buying ${xOffY_y} tix or more`;
    
    if (onlyTicketsTo) {
      baseTitle += ` in ${onlyTicketsTo}`;
      baseDescription += ` in ${onlyTicketsTo}`;
    }
    
    if (pricing === "base") {
      baseTitle += " (base price only)";
      baseDescription += " (base price only)";
    }
    
    if (order === "expensive") {
      baseTitle += " (most expensive first)";
      baseDescription += " (most expensive tickets first)";
    }
    
    document.getElementById("xOffYTix_title").value = `Title: ${baseTitle}`;
    document.getElementById("xOffYTix_description").value = `Description: ${baseDescription}`;
    document.getElementById("xOffYTix_code").value = `Code: ${baseCode}`;
  } else {
    document.getElementById("xOffYTix_title").value = "";
    document.getElementById("xOffYTix_description").value = "";
    document.getElementById("xOffYTix_code").value = "";
  }
});

// Get x# of Free Tier Tickets
document.getElementById("generateFreeTierBtn").addEventListener("click", () => {
  const freeTier_x = document.getElementById("freeTier_x").value;
  const freeTier_tier = document.getElementById("freeTier_tier").value;
  const minOrder = document.getElementById("freeTier_minOrder").value;
  const onlyTicketsTo = document.getElementById("freeTier_onlyTicketsTo").value.trim();
  const pricing = document.querySelector('input[name="freeTier_pricing"]:checked').value;
  const order = document.querySelector('input[name="freeTier_order"]:checked').value;
  
  if (freeTier_x && freeTier_tier) {
    let title, description, code;
    
    let functionName = "cart_";
    
    // Cheapest or costliest
    functionName += order === "expensive" ? "costliest" : "cheapest";
  
    functionName += "XSeatsTier";
    
    // Show group or show
    if (onlyTicketsTo) {
      functionName += "Group";
    }
    
    // Total or BaseTotal
    functionName += pricing === "total" ? "Total" : "BaseTotal";
    
    let baseCode = `SET @discount = dbo.${functionName}(@shopper, '${freeTier_tier}', ${freeTier_x})`;

    let baseTitle = `Get ${freeTier_x} Free ${freeTier_tier} Ticket(s)`;
    let baseDescription = `Get ${freeTier_x} free ticket(s) for tier "${freeTier_tier}"`;
    
    if (onlyTicketsTo) {
      baseTitle += ` in ${onlyTicketsTo}`;
      baseDescription += ` in ${onlyTicketsTo}`;
    }
    
    if (pricing === "base") {
      baseTitle += " (base price only)";
      baseDescription += " (base price only)";
    }
    
    if (order === "expensive") {
      baseTitle += " (most expensive first)";
      baseDescription += " (most expensive tickets first)";
    }
    
    // Min Order Size
    if (minOrder && minOrder > 0) {
      title = `Title: ${baseTitle} when buying ${minOrder} tickets or more`;
      description = `Description: ${baseDescription} when buying ${minOrder} tickets or more`;
      code = `Code: IF dbo.MinOf(dbo.cart_NumSeats(@shopper), ${minOrder}) = ${minOrder}\n${baseCode}`;
    } else {
      title = `Title: ${baseTitle}`;
      description = `Description: ${baseDescription}`;
      code = `Code: ${baseCode}`;
    }
    
    document.getElementById("freeTier_title").value = title;
    document.getElementById("freeTier_description").value = description;
    document.getElementById("freeTier_code").value = code;
  } else {
    document.getElementById("freeTier_title").value = "";
    document.getElementById("freeTier_description").value = "";
    document.getElementById("freeTier_code").value = "";
  }
});

// Save x% on additional shows
document.getElementById("generateAdditionalShowsBtn").addEventListener("click", () => {
  const percent = parseInt(document.getElementById("additionalShows_percent").value);
  const numTix = document.getElementById("additionalShows_numTix").value;
  const group = document.getElementById("additionalShows_group").value.trim();
  const minOrder = document.getElementById("additionalShows_minOrder").value;
  const pricing = document.querySelector('input[name="additionalShows_pricing"]:checked').value;
  const order = document.querySelector('input[name="additionalShows_order"]:checked').value;

  if (percent) {
    let title, description, code;
    
    let functionName = "cart_";
    
    // Cheapest or costliest
    functionName += order === "expensive" ? "costliest" : "cheapest";
    
    functionName += "XSeatsShow";
    
    // Total or BaseTotal
    functionName += pricing === "total" ? "Total" : "BaseTotal";
    
    let baseCode = "";
    if (group) {
      baseCode = `SET @discount = dbo.${functionName}(@shopper, dbo.cart_nthShowGroup(@shopper, 2, '${group}'), ${numTix || 1000}) * ${percent / 100}`;
    } else {
      baseCode = `SET @discount = dbo.${functionName}(@shopper, dbo.cart_nthShow(@shopper, 2), ${numTix || 1000}) * ${percent / 100}`;
    }

    let baseTitle = `Save ${percent}% on additional shows`;
    let baseDescription = `Save ${percent}% on additional shows`;
    
    if (group) {
      baseTitle += ` in ${group}`;
      baseDescription += ` in ${group}`;
    }
    
    if (pricing === "base") {
      baseTitle += " (base price only)";
      baseDescription += " (base price only)";
    }
    
    if (order === "expensive") {
      baseTitle += " (most expensive first)";
      baseDescription += " (most expensive tickets first)";
    }

    // Min Order Size
    if (minOrder && minOrder > 0) {
      title = `Title: ${baseTitle} when buying ${minOrder} tickets or more`;
      description = `Description: ${baseDescription} when buying ${minOrder} tickets or more`;
      code = `Code: IF dbo.MinOf(dbo.cart_NumSeats(@shopper), ${minOrder}) = ${minOrder}\n${baseCode}`;
    } else {
      title = `Title: ${baseTitle}`;
      description = `Description: ${baseDescription}`;
      code = `Code: ${baseCode}`;
    }

    document.getElementById("additionalShows_title").value = title;
    document.getElementById("additionalShows_description").value = description;
    document.getElementById("additionalShows_code").value = code;
  } else {
    document.getElementById("additionalShows_title").value = "";
    document.getElementById("additionalShows_description").value = "";
    document.getElementById("additionalShows_code").value = "";
  }
});
</script>
</body>
</html>
